<header class="bar-header">
    <a id="menu" role="button">
        <svg id="open" class="icon-menu"><use xlink:href="#icon-menu"></use></svg>
    </a>
    <h1 class="logo">
        <a href="{{ site.baseurl }}/">
            {% if site.use_logo %}
                {% include logo.html %}
            {% else %}
                {{ site.name }} <span class="version">{{ site.version }}</span>
            {% endif %}
        </a>
    </h1>
    <button type="button"
            class="site-theme-toggle"
            data-site-theme-toggle
            data-site-theme-location="jekyll-toolbar"
            aria-label="Switch color theme">
        <svg class="site-theme-icon site-theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.7 14.1A8.5 8.5 0 0 1 9.9 3.3 8.7 8.7 0 1 0 20.7 14.1Z"></path>
        </svg>
        <svg class="site-theme-icon site-theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
        </svg>
    </button>
    <a id="search" class="dosearch" role="button">
        <svg class="icon-search"><use xlink:href="#icon-search"></use></svg>
    </a>
</header>

<div id="mask" class="overlay"></div>

{% include menu.html %}
{% include search.html %}
