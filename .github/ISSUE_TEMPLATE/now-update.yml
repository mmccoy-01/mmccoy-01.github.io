name: Update the /now page
description: Update any part of /now, including adding a movie or series
title: "Now update: "
labels:
  - now-update
body:
  - type: markdown
    attributes:
      value: |
        Add only what changed. Blank fields preserve the current page. Markdown links such as `[label](https://example.com)` are supported in Workshop answers.

  - type: textarea
    id: working_on
    attributes:
      label: Working on
      placeholder: What has most of your attention right now?

  - type: textarea
    id: reading
    attributes:
      label: Reading
      placeholder: What are you reading or studying?

  - type: textarea
    id: small_pleasure
    attributes:
      label: Small pleasure
      placeholder: What small thing has been making life better?

  - type: textarea
    id: recent_discovery
    attributes:
      label: Recent discovery
      placeholder: What did you recently notice, learn, or rediscover?

  - type: textarea
    id: looking_forward
    attributes:
      label: Looking forward to
      placeholder: What are you anticipating?

  - type: textarea
    id: open_question
    attributes:
      label: One open question
      placeholder: What question is following you around?

  - type: textarea
    id: recommendation
    attributes:
      label: Something I recommend
      placeholder: What would you recommend to someone else?

  - type: textarea
    id: screen_notes
    attributes:
      label: Current screen notes
      description: Updates the first existing On Screen item. If adding a title below, use Personal notes for that title. Separate paragraphs with a blank line, or enter [clear] to remove the existing notes.
      placeholder: What do you think of what you are currently watching?

  - type: input
    id: featured_song
    attributes:
      label: Featured Apple Music song
      description: Paste a complete Apple Music song URL to replace the current featured song.
      placeholder: https://music.apple.com/us/song/...

  - type: markdown
    attributes:
      value: |
        ## Add a movie or series

        Leave this section blank if your On Screen list has not changed. If you provide an IMDb title, its public metadata is retrieved from OMDb; your API key remains in GitHub Secrets.

  - type: input
    id: imdb
    attributes:
      label: IMDb URL or ID
      description: A full IMDb title URL or an ID beginning with tt.
      placeholder: https://www.imdb.com/title/tt0083399/ or tt0083399

  - type: dropdown
    id: action
    attributes:
      label: On Screen action
      description: Add keeps the other titles. Replace removes the current list first. This is ignored when the IMDb field is blank.
      options:
        - Add to the current list
        - Replace the current list
      default: 0

  - type: input
    id: status
    attributes:
      label: Viewing status
      description: Short text for the poster badge. Defaults to In progress.
      placeholder: In progress, Finished, Paused, or Rewatching

  - type: input
    id: score
    attributes:
      label: Personal score
      description: Optional personal rating displayed alongside the IMDb rating.
      placeholder: 8/10

  - type: input
    id: date
    attributes:
      label: Date label
      description: Optional free-form date or viewing-period label.
      placeholder: Watched September 2026

  - type: textarea
    id: notes
    attributes:
      label: Personal notes
      description: Optional. Separate paragraphs with a blank line.
      placeholder: What did you think about it?

  - type: checkboxes
    id: confirmation
    attributes:
      label: Ready to update
      options:
        - label: I entered at least one new value above and am ready for the preview pull request.
          required: true
